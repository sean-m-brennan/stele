schema_version: "1"
kind: scenario
protocol: stele
name: stele-attest-certificate-needs-an-sbom
byte_pinning: false
description: |
    A certificate finding needs an ad that carries an SBOM: there is no proof
    of the owner's to check otherwise. carol's attest is refused and nothing is
    scored.

participants:
  - id: alice
    role: owner
  - id: bob
    role: member
  - id: carol
    role: verifier

fixtures:
  stele_ads:
    carol:
      - owner: alice
        name: demo
        url: http://forge.local/alice/demo.git
        ref: main
        commit: "0123456789abcdef0123456789abcdef01234567"
        seq: 1
        ts: 1790000000

steps:
  - id: 1
    from: carol
    to: carol
    function: trigger_stele_attest
    payload:
      owner: alice
      commit: "0123456789abcdef0123456789abcdef01234567"
      verdict: vuln
      count: 1
      channel: certificate
    description: carol attests on certificate.

expected_state:
  carol:
    stele_scores: []

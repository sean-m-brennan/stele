schema_version: "1"
kind: scenario
protocol: stele
name: stele-attest-self-consistency-needs-a-clean-claim
byte_pinning: false
description: |
    `self_consistency` is for a claim the owner signed. alice's ad makes none, so
    carol's attest on that channel is refused and nothing is scored.

participants:
  - id: alice
    role: owner
  - id: bob
    role: member
  - id: carol
    role: verifier

fixtures:
  stele_ads:
    carol:
      - owner: alice
        name: demo
        url: http://forge.local/alice/demo.git
        ref: main
        commit: "0123456789abcdef0123456789abcdef01234567"
        seq: 1
        ts: 1790000000
        v: 2
        claim_verdict: none

steps:
  - id: 1
    from: carol
    to: carol
    function: trigger_stele_attest
    payload:
      owner: alice
      commit: "0123456789abcdef0123456789abcdef01234567"
      verdict: vuln
      count: 2
      channel: self_consistency
    description: carol attests on self_consistency.

expected_state:
  carol:
    stele_scores: []

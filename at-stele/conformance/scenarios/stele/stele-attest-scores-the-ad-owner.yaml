schema_version: "1"
kind: scenario
protocol: stele
name: stele-attest-scores-the-ad-owner
byte_pinning: false
description: |
    Attesting a finding submits a verifier-attested score of 0.3 about the
    AD'S OWNER. The subject comes from the ad, never from the request, so a
    verifier cannot point a finding at a node that published nothing.

participants:
  - id: alice
    role: owner
  - id: bob
    role: member
  - id: carol
    role: verifier

fixtures:
  stele_ads:
    carol:
      - owner: alice
        name: demo
        url: http://forge.local/alice/demo.git
        ref: main
        commit: "0123456789abcdef0123456789abcdef01234567"
        seq: 1
        ts: 1790000000

steps:
  - id: 1
    from: carol
    to: carol
    function: trigger_stele_attest
    payload:
      owner: alice
      commit: "0123456789abcdef0123456789abcdef01234567"
      verdict: vuln
      count: 2
    description: carol scans alice's commit and finds two vulnerabilities.

expected_state:
  carol:
    stele_scores:
      - subject: alice
        score: 0.3

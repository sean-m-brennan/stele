schema_version: "1"
kind: scenario
protocol: stele
name: stele-attestation-forged-refused
byte_pinning: false
description: |
    An attestation is the verifier's own word: one signed by another key is
    refused.

participants:
  - id: alice
    role: owner
  - id: bob
    role: member
  - id: carol
    role: verifier

steps:
  - id: 1
    from: carol
    to: bob
    function: stele attest
    payload:
      ad_owner: alice
      name: demo
      url: http://forge.local/alice/demo.git
      ref: main
      commit: "0123456789abcdef0123456789abcdef01234567"
      seq: 1
      ts: 1790000000
      forged_by: alice
    description: alice signed the attestation carol sent.

expected_state:
  bob:
    stele_attestations_held: 0

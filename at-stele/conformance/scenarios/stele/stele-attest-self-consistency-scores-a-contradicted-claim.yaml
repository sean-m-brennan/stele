schema_version: "1"
kind: scenario
protocol: stele
name: stele-attest-self-consistency-scores-a-contradicted-claim
byte_pinning: false
description: |
    alice's ad claims her own CI found the release clean; carol's scan finds two
    vulnerabilities. A contradicted claim is scored on `self_consistency` at
    0.1, lower than a plain finding, because the owner said otherwise.

participants:
  - id: alice
    role: owner
  - id: bob
    role: member
  - id: carol
    role: verifier

fixtures:
  stele_ads:
    carol:
      - owner: alice
        name: demo
        url: http://forge.local/alice/demo.git
        ref: main
        commit: "0123456789abcdef0123456789abcdef01234567"
        seq: 1
        ts: 1790000000
        v: 2
        claim_verdict: clean

steps:
  - id: 1
    from: carol
    to: carol
    function: trigger_stele_attest
    payload:
      owner: alice
      commit: "0123456789abcdef0123456789abcdef01234567"
      verdict: vuln
      count: 2
      channel: self_consistency
    description: carol attests on self_consistency.

expected_state:
  carol:
    stele_scores:
      - subject: alice
        score: 0.1

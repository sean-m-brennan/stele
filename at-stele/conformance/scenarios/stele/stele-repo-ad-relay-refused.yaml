schema_version: "1"
kind: scenario
protocol: stele
name: stele-repo-ad-relay-refused
byte_pinning: false
description: |
    A repo ad is first-person only: carol sending an ad that names alice as
    its owner is refused, even though alice signed it. Nothing is relayed, so
    an ad always comes from the node that publishes the repository.

participants:
  - id: alice
    role: owner
  - id: bob
    role: member
  - id: carol
    role: verifier

steps:
  - id: 1
    from: carol
    to: bob
    function: stele repo
    payload:
      name: demo
      url: http://forge.local/alice/demo.git
      ref: main
      commit: "0123456789abcdef0123456789abcdef01234567"
      seq: 1
      ts: 1790000000
      owner: alice
      forged_by: alice
    description: carol relays alice's ad.

expected_state:
  bob:
    stele_ads_held: 0

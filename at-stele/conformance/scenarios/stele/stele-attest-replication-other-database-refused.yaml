schema_version: "1"
kind: scenario
protocol: stele
name: stele-attest-replication-other-database-refused
byte_pinning: false
description: |
    A replication re-runs the same check. carol scanned against another
    vulnerability database than bob did, so hers is a new probe, not a
    replication of his; on this channel it is refused.

participants:
  - id: alice
    role: owner
  - id: bob
    role: verifier
  - id: carol
    role: verifier

fixtures:
  stele_attestations:
    carol:
      - verifier: bob
        ad_owner: alice
        url: http://forge.local/alice/demo.git
        verdict: vuln
        count: 1

steps:
  - id: 1
    from: carol
    to: carol
    function: trigger_stele_attest
    payload:
      owner: alice
      commit: "0123456789abcdef0123456789abcdef01234567"
      verdict: vuln
      count: 1
      channel: replication
      db_digest: "1111111111111111111111111111111111111111111111111111111111111111"
      replicates:
        verifier: bob
        ad_owner: alice
        url: http://forge.local/alice/demo.git
        verdict: vuln
        count: 1
    description: carol attests on replication.

expected_state:
  carol:
    stele_scores: []

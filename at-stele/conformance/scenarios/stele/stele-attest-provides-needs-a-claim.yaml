schema_version: "1"
kind: scenario
protocol: stele
name: stele-attest-provides-needs-a-claim
byte_pinning: false
description: |
    A provides check answers the package a v4 ad claims. An ad that claims no
    package has nothing to check, even when it carries an SBOM: carol's attest
    is refused and nothing is scored.

participants:
  - id: alice
    role: owner
  - id: bob
    role: member
  - id: carol
    role: verifier

fixtures:
  stele_ads:
    carol:
      - owner: alice
        name: demo
        url: http://forge.local/alice/demo.git
        ref: main
        commit: "0123456789abcdef0123456789abcdef01234567"
        seq: 1
        ts: 1790000000
        v: 2
        sbom_digest: "abababababababababababababababababababababababababababababababab"
        sbom_path: sbom.cdx.json
        claim_verdict: none

steps:
  - id: 1
    from: carol
    to: carol
    function: trigger_stele_attest
    payload:
      owner: alice
      commit: "0123456789abcdef0123456789abcdef01234567"
      scanner: provides
      verdict: vuln
      count: 1
      channel: certificate
    description: carol attests a provides check against an ad that claims none.

expected_state:
  carol:
    stele_scores: []

schema_version: "1"
kind: scenario
protocol: stele
name: stele-repo-ad-held
byte_pinning: false
description: |
    A repo ad from its owner is verified and held. (The id it is held under,
    blake2b-256 of the canonical "STELE-REPO\0" owner|name|url|ref|commit|seq|ts
    bytes, is pinned across the two runtimes by a fixed-owner vector in both
    unit suites: the two identity adapters derive participant uuids
    differently, so an id over one cannot be pinned here.)

participants:
  - id: alice
    role: owner
  - id: bob
    role: member
  - id: carol
    role: verifier

steps:
  - id: 1
    from: alice
    to: bob
    function: stele repo
    payload:
      name: demo
      url: http://forge.local/alice/demo.git
      ref: main
      commit: "0123456789abcdef0123456789abcdef01234567"
      seq: 1
      ts: 1790000000
    description: alice advertises her repository at a commit.

expected_state:
  bob:
    stele_ads_held: 1

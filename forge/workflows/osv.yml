# The OWNER's own scan and SBOM (Stele CI seam). Nothing here is scored as it
# stands. What the owner may do with it is CLAIM: advertise the release with
# `claim_verdict: clean` and the digest of the SBOM it commits
# (`stele_ctl.py advertise --claim clean --sbom sbom.cdx.json=...`). The
# verifier then checks both from its own clone: the SBOM against its own
# (`certificate`), and the clean claim against its own scans
# (`self_consistency`). See verifier/stele_hook.py.
#
# `run:` steps only, so nothing is fetched from an actions marketplace.
name: osv
on: [push]
jobs:
  scan:
    runs-on: stele
    steps:
      - name: fetch the commit
        run: |
          git clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" src
          git -C src checkout "${GITHUB_SHA}"
      - name: osv-scanner
        run: |
          wget -q -O osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source -r --format json src > osv.json || true
          head -c 2000 osv.json
      - name: sbom (syft, CycloneDX)
        # The runner is the host (label stele:host), so this is the host's own
        # syft; the verifier compares against its syft, so both should agree.
        run: |
          if command -v syft >/dev/null; then
            syft dir:src -o cyclonedx-json -q > sbom.cdx.json
            sha256sum sbom.cdx.json
          else
            echo "syft is not installed on this runner; no SBOM"
          fi
